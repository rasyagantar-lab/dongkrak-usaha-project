<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KuyDigitalMediaDongkrakUsahaAssistant - v.1.0.0 
  </title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-card">
    <div class="header">
      <div class="logo">🚀 Kuy Digital Media DongkrakUsaha Assistant</div>
      <span class="badge">v1.0.0</span>
    </div>

    <div class="status-box">
      <div class="status-row">
        <span>Tab DongkrakUsaha:</span>
        <strong id="tabStatus">Memeriksa...</strong>
      </div>
      <div class="status-row">
        <span>Status Login:</span>
        <strong id="loginStatus">Memeriksa...</strong>
      </div>
      <div class="status-row">
        <span>Form Input Produk:</span>
        <strong id="formStatus">Memeriksa...</strong>
      </div>
    </div>

    <div class="fields-summary">
      <span id="fieldsCount">0 Field Terdeteksi</span>
    </div>

    <div class="fields-summary" id="measureResult" style="display:none; white-space:normal; line-height:1.4"></div>

    <div class="actions">
      <button id="btnCheck" class="btn btn-primary">Refresh Status</button>
      <button id="btnMeasure" class="btn btn-secondary" title="Hitung isi kolom deskripsi dan daftar maxlength di tab DongkrakUsaha yang terbuka">Ukur Field Halaman Ini</button>
      <a href="https://dongkrakusaha.com/panelMember/" target="_blank" class="btn btn-secondary">Buka Member Panel</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
